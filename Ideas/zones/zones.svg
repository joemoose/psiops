<line x1="129" y1="418" x2="347" y2="418" stroke="#a8a6a0" stroke-width="1.5"/>
<line x1="129" y1="418" x2="249" y2="536" stroke="#a8a6a0" stroke-width="1.5"/>
<line x1="347" y1="418" x2="249" y2="536" stroke="#a8a6a0" stroke-width="1.5"/>
<g>
