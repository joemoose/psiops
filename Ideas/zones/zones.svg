<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Tactical zone network diagram</title>
<desc>Seven connected tactical zones arranged as a network: Forest Edge leads to the Kill Zone and on to the Main Floor, which branches to the Catwalk, the Office, and the Generator Room; the Office and Generator Room connect, and both lead to the Research Facility.</desc>
<style>.zt{font-size:15px;font-weight:500;fill:#2c2c2a;}.zd{font-size:12px;font-weight:400;fill:#5f5e5a;}</style>
<line x1="249" y1="72" x2="249" y2="182" stroke="#a8a6a0" stroke-width="1.5"/>
<line x1="249" y1="182" x2="188" y2="300" stroke="#a8a6a0" stroke-width="1.5"/>
<line x1="188" y1="300" x2="430" y2="300" stroke="#a8a6a0" stroke-width="1.5"/>
<line x1="188" y1="300" x2="129" y2="418" stroke="#a8a6a0" stroke-width="1.5"/>
