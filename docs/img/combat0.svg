<svg xmlns="http://www.w3.org/2000/svg" aria-label="PSIOPS Combat Flowchart." class="combat-flowchart-svg" font-family="'Architects Daughter', cursive" viewBox="0 0 858 892"><defs><filter id="cf__shadow" width="160%" height="160%" x="-30%" y="-30%"><feDropShadow dx="3" dy="3" flood-color="#000" flood-opacity=".3" stdDeviation="3.5"/></filter><style>@import url(https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;display=swap);.cf__box{fill:var(--diagram-surface,#fff);stroke:currentColor;stroke-width:3;filter:url(#cf__shadow)}.cf__lbl{font-family:&quot;Architects Daughter&quot;,cursive;fill:currentColor;text-anchor:middle;dominant-baseline:middle}.cf__edge{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.cf__elbl,.cf__hdr{font-family:&quot;Architects Daughter&quot;,cursive;fill:currentColor;text-anchor:middle;dominant-baseline:middle}.cf__elbl{paint-order:stroke;stroke:var(--diagram-surface,#fff);stroke-width:5px;stroke-linejoin:round}.cf__hdr{letter-spacing:1px}</style></defs><text x="178" y="34" class="cf__hdr" font-size="19">1 · WHO ACTS FIRST?</text><text x="642" y="34" class="cf__hdr" font-size="19">2 · THE COMBAT ROUND</text><path stroke-width="1.8" d="M60 48h236m218 0h256" class="cf__edge"/><path d="M178 111v30m-6-11 6 11 6-11m-6 121v46m-6-11 6 11 6-11" class="cf__edge"/><text x="194" y="286" class="cf__elbl" font-size="14">NO</text><path d="M178 415v63m-6-11 6 11 6-11" class="cf__edge"/><text x="194" y="446" class="cf__elbl" font-size="14">NO</text><path d="M178 534v51m-6-11 6 11 6-11m458-410v56m-6-11 6 11 6-11m-6 83v54m-6-11 6 11 6-11m-6 99v50m-6-11 6 11 6-11m-6 83v40m-6-11 6 11 6-11m-6 143v67m-6-11 6 11 6-11" class="cf__edge"/><text x="660" y="752" class="cf__elbl" font-size="14">YES</text><path d="M266 196h34v182h222" class="cf__edge"/><path d="m511 384 11-6-11-6" class="cf__edge"/><text x="283" y="183" class="cf__elbl" font-size="14">YES</text><path d="M283 356h55V114h184" class="cf__edge"/><path d="m511 120 11-6-11-6" class="cf__edge"/><text x="312" y="343" class="cf__elbl" font-size="14">YES</text><path d="M290 648h108V144h124" class="cf__edge"/><path d="m511 150 11-6-11-6" class="cf__edge"/><text x="345" y="635" class="cf__elbl" font-size="14">YES</text><path d="M178 711h292V404h52" class="cf__edge"/><path d="m511 410 11-6-11-6" class="cf__edge"/><text x="300" y="698" class="cf__elbl" font-size="14">NO</text><path d="M766 662h40V128h-44" class="cf__edge"/><path d="m774 122-12 6 12 6" class="cf__edge"/><text x="806" y="395" class="cf__elbl" font-size="14">NO</text><text x="806" y="413" class="cf__elbl" font-size="14">(next round)</text><rect width="192" height="50" x="82" y="61" class="cf__box cf__term" rx="25"/><text x="178" y="86" class="cf__lbl" font-size="16"><tspan x="178" dy="0">Combat Mode Begins</tspan></text><path d="m178 141 88 55-88 55-88-55Z" class="cf__box"/><text x="178" y="187" class="cf__lbl" font-size="15"><tspan x="178" dy="0">Were you</tspan><tspan x="178" dy="18">ambushed?</tspan></text><path d="m178 297 105 59-105 59-105-59Z" class="cf__box"/><text x="178" y="347" class="cf__lbl" font-size="15"><tspan x="178" dy="0">Did you ambush</tspan><tspan x="178" dy="18">them?</tspan></text><rect width="178" height="56" x="89" y="478" class="cf__box" rx="2"/><text x="178" y="506" class="cf__lbl" font-size="16"><tspan x="178" dy="0">Roll Initiative</tspan></text><path d="m178 585 112 63-112 63-112-63Z" class="cf__box"/><text x="178" y="639" class="cf__lbl" font-size="15"><tspan x="178" dy="0">Can you act in</tspan><tspan x="178" dy="18">the first turn?</tspan></text><rect width="240" height="72" x="522" y="92" class="cf__box" rx="2"/><text x="642" y="119" class="cf__lbl" font-size="16"><tspan x="642" dy="0">Players declare their</tspan><tspan x="642" dy="19">Moves &amp; Actions</tspan></text><rect width="240" height="72" x="522" y="220" class="cf__box" rx="2"/><text x="642" y="247" class="cf__lbl" font-size="16"><tspan x="642" dy="0">GM &amp; players resolve</tspan><tspan x="642" dy="19">the Moves &amp; Actions</tspan></text><rect width="240" height="88" x="522" y="346" class="cf__box" rx="2"/><text x="642" y="374" class="cf__lbl" font-size="14"><tspan x="642" dy="0">Opponents take their turn —</tspan><tspan x="642" dy="17">GM declares their</tspan><tspan x="642" dy="17">Moves &amp; Actions</tspan></text><rect width="240" height="72" x="522" y="484" class="cf__box" rx="2"/><text x="642" y="511" class="cf__lbl" font-size="16"><tspan x="642" dy="0">GM &amp; players resolve</tspan><tspan x="642" dy="19">the Moves &amp; Actions</tspan></text><path d="m642 596 124 66-124 66-124-66Z" class="cf__box"/><text x="642" y="653" class="cf__lbl" font-size="15"><tspan x="642" dy="0">One side defeated</tspan><tspan x="642" dy="18">or withdraws?</tspan></text><rect width="196" height="50" x="544" y="795" class="cf__box cf__term" rx="25"/><text x="642" y="820" class="cf__lbl" font-size="16"><tspan x="642" dy="0">Combat Mode Ends</tspan></text></svg>