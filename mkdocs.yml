# Project information

site_name: "PSIOPS Operative's Guide"
site_url: https://joemoose.github.io/psiops/
site_author: Zachary Taylor
site_description: An Adventure Roleplaying Game of Paranormal Special Forces
site_dir: ../joemoose.github.io/psiops/

# Repo

repo_url: https://github.com/joemoose/engigma/
edit_uri: blob/main/docs

# Navigation

nav:
  - 'Introduction': index.md
  - character.md
  - playing.md
  - combat.md
  - stress.md
  - summary.md
  - attribution.md
    
# Theme

theme:
  name: material
  language: en
  font: false
  logo: logo.png
  favicon: favicon.ico
  icon:
    edit: octicons/pencil-24
  features:
    - content.action.edit
    - content.tooltips
    - header.autohide
    - navigation.footer
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      primary: black
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: black
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Extensions

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3

# CSS

extra_css:
  - stylesheets/extra.css
  - stylesheets/print.css

# Plugins

plugins:
  - search:
      lang: en
